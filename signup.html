<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Join NaijaJobs to discover gigs, showcase your skills or find people ready to help with your tasks.">
    <meta name="theme-color" content="#0e3b2c">
    <title>Create account | NaijaJobs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/polish.css">
<link rel="icon" type="image/png" href="icons/naijajobs-96.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="NaijaJobs">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <header class="site-header">
        <div class="container bar">
            <a href="index.html" class="logo" aria-label="NaijaJobs home">Naija<span>Jobs</span></a>
            <nav aria-label="Main navigation">
                <a href="index.html" class="hide-sm">Home</a>
                <a href="login.html" class="btn btn-sm btn-ghost">Log in</a>
            </nav>
        </div>
    </header>

    <main class="auth">
        <div class="auth-box">
            <div class="head">
                <h1>Create your account</h1>
                <p>Free to join. Find work or hire people in minutes.</p>
            </div>

            <form id="signup-form" class="auth-form">
                <div class="field">
                    <label for="full-name">Full name</label>
                    <input type="text" id="full-name" name="full-name" placeholder="Your full name" autocomplete="name" minlength="2" required>
                </div>
                <div class="field">
                    <label for="username">Username</label>
                    <input
                    type="text" id="username" name="username" placeholder="e.g. daniel_dev" autocomplete="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" title="Use 3–20 letters, numbers, or underscores." required
                    >
                    <small class="field-hint">
                        Choose a unique username. You can use it to log in.
                    </small>
                </div>

                <div class="field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" minlength="6" required>
                    <small class="field-hint">Use at least 6 characters.</small>
                </div>
                <div class="field">
                    <label for="account-type">How will you use NaijaJobs?</label>
                    <select id="account-type" name="account-type" required>
                        <option value="" selected disabled>Choose one</option>
                        <option value="worker">I want to find jobs and earn money</option>
                        <option value="client">I want to post jobs and hire people</option>
                    </select>
                </div>
                <button type="submit" class="auth-button">Create my account</button>
                <p id="signup-message" class="auth-message" role="status" aria-live="polite"></p>
            </form>

            <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
    <script src="js/polish.js" defer></script>
</body>
</html>
