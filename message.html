<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Your private conversation on NaijaJobs.">
    <meta name="theme-color" content="#0e3b2c">
    <title>Chat | NaijaJobs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/polish.css">
<link rel="icon" type="image/png" href="icons/naijajobs-96.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="NaijaJobs">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="chat">
    <main class="nj-chat-page">
        <header class="nj-chat-header">
            <a class="nj-chat-back" href="messages.html" aria-label="Back to inbox">&larr; Back</a>
            <div class="nj-chat-avatar" id="chat-avatar">
                <span id="chat-avatar-letter">?</span>
                <img
                id="chat-profile-picture"
                alt="Chat partner profile picture"
                hidden
                >
            </div>

            <div>
                <h1 id="chat-name">NaijaJobs chat</h1>
                <p id="chat-status">Your private conversation</p>
            </div>
        </header>

        <div class="nj-chat-messages" id="chat-messages" aria-live="polite">
            <div class="nj-chat-notice">Loading conversation...</div>
        </div>

        <form class="nj-chat-form" id="chat-form">
            <textarea id="chat-input" maxlength="5000" rows="1" placeholder="Type your message" aria-label="Your message" required></textarea>
            <button type="submit" id="chat-send">Send</button>
        </form>
        <p id="chat-notice" class="nj-chat-notice" role="status"></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
    <script src="js/polish.js" defer></script>
</body>
</html>
