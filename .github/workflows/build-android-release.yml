name: Build NaijaJobs Android Release

on:
  workflow_dispatch:

jobs:
  android-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android dependencies and sync project
        working-directory: apps/android
        run: |
          npm ci
          npm run prepare-web
          npx cap sync android

      - name: Configure Firebase
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
            echo "Missing GitHub secret: ANDROID_GOOGLE_SERVICES_JSON"
            exit 1
          fi

          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > apps/android/android/app/google-services.json

      - name: Configure Android signing
        working-directory: apps/android/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/naijajobs-release-key.jks
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "One or more Android signing secrets are missing."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

          if [ ! -s "$ANDROID_KEYSTORE_PATH" ]; then
            echo "Android keystore could not be restored."
            exit 1
          fi

      - name: Build signed release APK
        working-directory: apps/android/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/naijajobs-release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: NaijaJobs-android-release-apk
          path: apps/android/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error