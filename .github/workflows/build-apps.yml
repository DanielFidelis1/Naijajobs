# Builds the Android APK and the Windows / Mac / Linux apps in the cloud (free on GitHub).
# Run it from the "Actions" tab -> "Build NaijaJobs apps" -> "Run workflow".
# Download the results from the "Artifacts" section of the finished run.
name: Build NaijaJobs apps

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install and create the Android project
        working-directory: apps/android
        run: |
          npm install
          npm run setup
      - name: Build debug APK
        working-directory: apps/android/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NaijaJobs-android-apk
          path: apps/android/android/app/build/outputs/apk/debug/*.apk

  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build desktop app
        working-directory: apps/desktop
        run: |
          npm install
          npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: NaijaJobs-desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
  
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and create iOS project
        working-directory: apps/ios
        run: |
          npm install
          npm run setup

      - name: Build iOS application
        working-directory: apps/ios
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned iOS IPA
        working-directory: apps/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r NaijaJobs-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NaijaJobs-iOS-unsigned-IPA
          path: apps/ios/NaijaJobs-unsigned.ipa
