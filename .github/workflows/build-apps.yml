
name: Build NaijaJobs apps

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android dependencies and sync project
        working-directory: apps/android
        run: |
          npm ci
          npm run prepare-web
          npx cap sync android

      - name: Configure Firebase
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
            echo "Missing GitHub secret: ANDROID_GOOGLE_SERVICES_JSON"
            exit 1
          fi
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > apps/android/android/app/google-services.json

      - name: Build debug APK
        working-directory: apps/android/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NaijaJobs-android-apk
          path: apps/android/android/app/build/outputs/apk/debug/*.apk

  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build desktop app
        working-directory: apps/desktop
        run: |
          npm install
          npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: NaijaJobs-desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Firebase iOS configuration
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$IOS_GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "Missing IOS_GOOGLE_SERVICE_INFO_PLIST secret."
            exit 1
          fi

          mkdir -p apps/ios/ios/App/App
          printf '%s' "$IOS_GOOGLE_SERVICE_INFO_PLIST" | base64 -D > apps/ios/ios/App/App/GoogleService-Info.plist
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install iOS dependencies and sync project
        working-directory: apps/ios
        run: |
          npm ci
          npm run prepare-web
          npx cap sync ios

      - name: Build iOS application
        working-directory: apps/ios
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned iOS IPA
        working-directory: apps/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r NaijaJobs-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NaijaJobs-iOS-unsigned-IPA
          path: apps/ios/NaijaJobs-unsigned.ipa
