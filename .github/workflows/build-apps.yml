
# Builds the Android APK and the Windows / Mac / Linux apps in the cloud (free on GitHub).
# Run it from the "Actions" tab -> "Build NaijaJobs apps" -> "Run workflow".
# Download the results from the "Artifacts" section of the finished run.
name: Build NaijaJobs apps

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install and create the Android project
        working-directory: apps/android
        run: |
          npm install
          npm run setup
      - name: Build debug APK
        working-directory: apps/android/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NaijaJobs-android-apk
          path: apps/android/android/app/build/outputs/apk/debug/*.apk

  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - name: Build desktop app
        working-directory: apps/desktop
        run: |
          npm install
          npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: NaijaJobs-desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
