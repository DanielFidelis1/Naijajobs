<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Log in to NaijaJobs to find jobs, manage your gigs and grow your income.">
    <meta name="theme-color" content="#0e3b2c">
    <title>Log in | NaijaJobs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/polish.css">
<link rel="icon" type="image/png" href="icons/naijajobs-96.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="NaijaJobs">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <header class="site-header">
        <div class="container bar">
            <a href="index.html" class="logo" aria-label="NaijaJobs home">Naija<span>Jobs</span></a>
            <nav aria-label="Main navigation">
                <a href="index.html" class="hide-sm">Home</a>
                <a href="signup.html" class="btn btn-sm btn-ghost">Create account</a>
            </nav>
        </div>
    </header>

    <main class="auth">
        <div class="auth-box">
            <div class="head">
                <h1>Welcome back</h1>
                <p>Log in to find jobs and manage your gigs.</p>
            </div>

            <form id="login-form" class="auth-form">
                <div class="field">
                    <label for="email">Email or username</label>
                    <input
                    type="text"
                    id="email"
                    name="email"
                    placeholder="Enter your email or username"
                    autocomplete="username"
                    required
                    >
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Your password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="auth-button">Log in</button>
                <p id="login-message" class="auth-message" role="status" aria-live="polite"></p>
            </form>

            <p class="auth-footer">New here? <a href="signup.html">Create an account</a></p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js"></script>
    <script src="js/polish.js" defer></script>
</body>
</html>
