<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0e3b2c">
    <title>You're offline | NaijaJobs</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/polish.css">
<link rel="icon" type="image/png" href="icons/naijajobs-96.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="NaijaJobs">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <main class="auth">
        <div class="auth-box" style="text-align:center">
            <a href="/index.html" class="logo" aria-label="NaijaJobs home">Naija<span>Jobs</span></a>
            <div class="auth-form" style="margin-top:28px">
                <h1 style="font-size:1.6rem">You're offline</h1>
                <p class="muted" style="margin:10px 0 22px">
                    We can't reach the internet right now. Check your data or Wi-Fi, then try again.
                </p>
                <button type="button" class="btn btn-yellow" onclick="location.reload()">Try again</button>
            </div>
        </div>
    </main>
    <script src="js/polish.js" defer></script>
</body>
</html>
