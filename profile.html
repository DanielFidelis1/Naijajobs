<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Keep your NaijaJobs profile and skills up to date.">
    <meta name="theme-color" content="#0e3b2c">
    <title>Profile | NaijaJobs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/polish.css">
<link rel="icon" type="image/png" href="icons/naijajobs-96.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="NaijaJobs">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="app">
    <main class="main" id="main">
        
<div class="profile-head">

    <div class="profile-photo-section">
        <div class="avatar profile-photo-avatar">
            <img
                id="profile-picture"
                alt="Your profile picture"
                hidden
            >
            <span id="profile-avatar-letter">N</span>
        </div>

        <div class="profile-photo-controls">
            <label for="profile-picture-input">Profile picture</label>

            <input
                type="file"
                id="profile-picture-input"
                accept="image/jpeg,image/png,image/webp"
            >

            <small>JPG, PNG, or WebP. Maximum size: 2 MB.</small>

            <button type="button" id="upload-profile-picture">
                Upload picture
            </button>
        </div>

        <div
            id="profile-picture-message"
            role="status"
            aria-live="polite"
        ></div>
    </div>

    <div class="profile-heading">
        <div class="profile-name-row">
            <h1 id="profile-display-name">My profile</h1>
            <span
            id="worker-premium-badge"
            class="worker-premium-badge"
            hidden
            >✦ PREMIUM</span>
        </div>
        <p>Show clients what you can do.</p>
    </div>


</div>


            <div class="form-card">
                <form id="profile-form">
                    <div class="field">
                        <label for="full-name">Full name</label>
                        <input type="text" id="full-name" name="full_name" placeholder="Your full name" required>
                    </div>

                    <div class="field">
                        <label for="profile-email">Email address</label>
                        <input type="email" id="profile-email" name="email" placeholder="Your email address" readonly>
                        <small>Linked to your account.</small>
                    </div>

                    <div class="row2">
                        <div class="field">
                            <label for="account-type">Account type</label>
                            <select id="account-type" name="account_type" required>
                                <option value="">Select account type</option>
                                <option value="worker">Job seeker / worker</option>
                                <option value="client">Client / employer</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="location">Location</label>
                            <input type="text" id="location" name="location" placeholder="e.g. Abuja, Nigeria">
                        </div>
                    </div>

                    <div class="field">
                        <label for="skills">Skills</label>
                        <textarea id="skills" name="skills" rows="3" placeholder="e.g. Web design, writing, programming"></textarea>
                        <small>Separate your skills with commas.</small>
                    </div>

                    <div class="field">
                        <label for="bio">About you</label>
                        <textarea id="bio" name="bio" rows="5" placeholder="Tell clients a little about yourself"></textarea>
                    </div>

                    <button type="submit" class="btn profile-save-button">Save changes</button>
                    <div id="profile-message" class="profile-message" role="status" aria-live="polite"></div>
                </form>
            </div>

            <p class="profile-public-link">
                <a class="text-link" id="view-public-profile" href="worker-profile.html">See how others view your profile</a>
            </p>

            <div class="form-card email-card" id="email-alerts-card">
                <label class="check-row" for="email-alerts">
                    <input type="checkbox" id="email-alerts" checked>
                    <span>
                        <strong>Email me about new activity</strong>
                        <small>New applicants, acceptances, messages and reviews.</small>
                    </span>
                </label>
                <p id="email-alerts-message" class="form-message" role="status" aria-live="polite"></p>
            </div>

            <h2 class="section-title">Reviews you have received</h2>
            <div id="profile-reviews" class="profile-reviews" aria-live="polite">
                <div class="loading"><span class="nj-loading-spinner"></span><p>Loading reviews...</p></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/shell.js"></script>
    <script src="js/app.js"></script>
    <script src="js/polish.js" defer></script>
</body>
</html>
