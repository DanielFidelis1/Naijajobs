<body class="app">
    <main class="main" id="main">

                    </div>

                    <div class="field">
                        <label for="job-description">Description</label>
                        <textarea id="job-description" rows="6" placeholder="Describe the work, requirements and the result you expect" required></textarea>
                    </div>

                    <div class="row2">
                        <div class="field">
                            <label for="job-category">Category</label>
                            <select id="job-category" required>

                                    <option value="Engineering & Technical Services">Engineering & Technical Services</option>
                                    <option value="Business & Administration">Business & Administration</option>
                                    <option value="Sales & Marketing">Sales & Marketing</option>
                                    <option value="Finance & Accounting">Finance & Accounting</option>
                                    <option value="Education & Training">Education & Training</option>
                                    <option value="Healthcare & Medical">Healthcare & Medical</option>
                                    <option value="Media, Arts & Entertainment">Media, Arts & Entertainment</option>
                                </optgroup>
                                <optgroup label="Skilled & Everyday Work">
                                    <option value="Construction & Skilled Trades">Construction & Skilled Trades</option>
                                    <option value="Transport & Logistics">Transport & Logistics</option>
                                    <option value="Hospitality & Food Services">Hospitality & Food Services</option>
                                    <option value="Agriculture & Farming">Agriculture & Farming</option>
                                    <option value="Cleaning & Domestic Services">Cleaning & Domestic Services</option>
                                    <option value="Security & Safety">Security & Safety</option>
                                    <option value="Beauty, Fashion & Lifestyle">Beauty, Fashion & Lifestyle</option>
                                    <option value="Retail & Customer Service">Retail & Customer Service</option>
                                    <option value="General Labour & Casual Work">General Labour & Casual Work</option>
                                    <option value="Other Services">Other Services</option>
                                </optgroup>

                                <option value="Graphic Design">Graphic Design</option>
                                <option value="Writing">Writing</option>
                                <option value="Web Development">Web Development</option>
                                <option value="Photography">Photography</option>
                                <option value="Video Editing">Video Editing</option>
                                <option value="Tutoring">Tutoring</option>
                                <option value="Tech Support">Tech Support</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="job-subcategory">Subcategory</label>
                            <select id="job-subcategory" required disabled>
                                <option value="">Select a category first</option>
                            </select>
                        </div>
                        
<div class="field budget-field">
    <label for="job-budget">Choose your budget</label>

    <div class="budget-options">
        <button type="button" class="budget-option" data-budget="5000">₦5,000</button>
        <button type="button" class="budget-option" data-budget="10000">₦10,000</button>
        <button type="button" class="budget-option" data-budget="20000">₦20,000</button>
        <button type="button" class="budget-option" data-budget="30000">₦30,000</button>
        <button type="button" class="budget-option" data-budget="50000">₦50,000</button>
        <button type="button" class="budget-option" data-budget="100000">₦100,000</button>

    </div>
</div>

<!-- Keeps compatibility with existing job-posting code -->
<input type="hidden" id="job-location">

<div class="field">
    <label for="job-type">Job type</label>
    <select id="job-type" required>
        <option value="">Select type</option>
        <option value="remote">Remote</option>
        <option value="onsite">On-site</option>
        <option value="hybrid">Hybrid</option>
    </select>
</div>

                    <div class="field">
                        <label for="job-deadline">Application deadline</label>
                        <input type="date" id="job-deadline" required>
                        <small>The last day people can apply.</small>
                    </div>

                    <button type="submit" class="btn post-job-submit-button">Publish job</button>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const budgetInput = document.getElementById("job-budget");
        const budgetButtons = document.querySelectorAll(".budget-option");
        const customButton = document.getElementById("custom-budget-option");
        
        if (!budgetInput || !budgetButtons.length || !customButton) return;
        
        budgetButtons.forEach(function (button) {
            button.addEventListener("click", function () {
                budgetButtons.forEach(function (item) {
                    item.classList.remove("selected");
                });

                button.classList.add("selected");

                if (button === customButton) {
                    budgetInput.readOnly = false;
                    budgetInput.value = "";
                    budgetInput.placeholder = "Enter your budget";
                    budgetInput.focus();
                } else {
                    budgetInput.readOnly = true;
                    budgetInput.value = button.dataset.budget;
                    budgetInput.placeholder = "Select an amount above";
                }
            });
        });
        });
</script>

    function updateLocation() {
        const state = stateSelect.value;

        citySelect.innerHTML = "";
        locationInput.value = "";

        if (state === "Remote") {
            citySelect.add(new Option("Nationwide", "Remote"));
            citySelect.disabled = true;
            locationInput.value = "Remote";
            return;
        }

        citySelect.disabled = false;
        citySelect.add(new Option("Select a city or town", ""));

        (cities[state] || []).forEach(function (city) {
            citySelect.add(new Option(city, city));
        });
    }

    stateSelect.addEventListener("change", updateLocation);

    citySelect.addEventListener("change", function () {
        if (stateSelect.value && citySelect.value) {
            locationInput.value =
                citySelect.value + ", " + stateSelect.value + ", Nigeria";
        } else {
            locationInput.value = "";
        }
    });

    updateLocation();
});
</script>
