<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Track the jobs you have applied for and their status.">
    <meta name="theme-color" content="#0e3b2c">
    <title>My applications | NaijaJobs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/polish.css">
<link rel="icon" type="image/png" href="icons/naijajobs-96.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="NaijaJobs">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="app">
    <main class="main" id="main">
        <div class="page">
            <header class="page-head">
                <div>
                    <h1>My applications</h1>
                    <p class="sub">Jobs you have applied for and where they stand.</p>
                </div>
                <a href="browse.html" class="btn btn-ghost btn-sm">Find more jobs</a>
            </header>

            <div class="stats">
                <div class="stat"><h3 id="seeker-total-applications">&ndash;</h3><p>Total</p></div>
                <div class="stat"><h3 id="seeker-pending-applications">&ndash;</h3><p>Pending</p></div>
                <div class="stat"><h3 id="seeker-accepted-applications">&ndash;</h3><p>Accepted</p></div>
                <div class="stat"><h3 id="seeker-rejected-applications">&ndash;</h3><p>Not successful</p></div>
            </div>

            <div id="applications-container" class="applications-container" aria-live="polite">
                <div class="nj-applications-loading"><span class="nj-loading-spinner"></span><p>Loading your applications...</p></div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/shell.js"></script>
    <script src="js/app.js"></script>
    <script src="js/polish.js" defer></script>
</body>
</html>
